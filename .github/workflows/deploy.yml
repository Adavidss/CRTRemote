name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rejects the lockfile when the runner's npm is older than the
      # one that wrote it. `npm install` is tolerant and just as reproducible here.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        run: npx oxlint src
        continue-on-error: true

      - name: Build
        run: npx vite build

      # Pages runs Jekyll over the artifact unless told not to, which strips
      # any directory beginning with an underscore.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      # Pages must be enabled once by hand, under Settings → Pages → Source:
      # GitHub Actions. `enablement: true` looks like it would do it, but the
      # workflow's default token cannot create a Pages site — it needs
      # administration rights the token is not granted — so it fails with
      # "Resource not accessible by integration" instead of a useful message.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
