name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rejects the lockfile when the runner's npm is older than the
      # one that wrote it. `npm install` is tolerant and just as reproducible here.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        run: npx oxlint src
        continue-on-error: true

      - name: Build
        run: npx vite build

      # Pages runs Jekyll over the artifact unless told not to, which strips
      # any directory beginning with an underscore.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      # `enablement` turns Pages on for the repository if it is not already,
      # rather than failing the first run with "Get Pages site failed". Note
      # what it means: the built site becomes publicly readable at the Pages
      # URL. Remove this flag and disable Pages in the repository settings to
      # undo it.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
